page_title: חיפוש
page_icon: 'ph:bold/magnifying-glass'
try:
  title: 'נסה את זה'
  body: |
    שדה אחד, כל סוגי התוצאות. שמות העמודים מגיעים מהנתב ואינם דורשים הצהרה; רשומות מגיעות מהיישויות הנושאות את המאפיין למטה. כל תוצאה נושאת את היעד שלה, כך שהשורה אינה צריכה להחליט מה המשמעות של לחיצה.
providers:
  title: ספקים
  body: |
    ספק הוא משפחה אחת של דברים שניתן למצוא. יישום הממשק הוא כל ההרשמה — תיוג אוטומטי מסמן זאת, כך שספק שנכתב ביישום מצטרף לחיפוש על ידי קיום. אלו הם הספקים שעונים כאן, לפי השם שהשאילתה מגבילה את עצמה אליו.
entities:
  title: 'יישויות ניתנות לחיפוש'
  body: |
    המחלקה אומרת שישות ניתנת למציאה; המאפיינים שלה אומרים על מה, כל אחד עם הסוג שלו — כותרת נקראת, כמות היא מספר, כתובת היא שלמה או לא כלום — והסוג קובע גם את ה-SQL וגם את הנקודות. שישה מתוך שבעת פונקציות הניקוד של המורשת היו אותה רשימה בתחפושת. השביעי היה בעל היגיון, וזה אחד שנקרא כיתת ניקוד; הישות whose answer depends on who is asking מוסיפה provider: true ומקבלת ספק משלה.
  empty: 'עדיין אין ישות המצהירה על המאפיין ביישום הזה — תוצאות העמוד עדיין פועלות.'
  fields: שדות
  scoring: 'ניקוד לפי'
  contexts: הקשרים
  own_provider: 'מסופק על ידי ספק משלו.'
api:
  title: ה-API
  body: |
    תוצאה היא ישות, כך שהנקודה שלה היא האוסף של אותה ישות ושום דבר נוסף. מאגר ה-TypeScript שנוצר מאותה מחלקת PHP קורא לה מבלי שיגידו לו היכן היא — מה שהשדה למעלה משתמש בו.
  query: 'פרמטרי שאילתה'
  query_search: 'מה מחפשים. שאילתה ריקה לא עונה על כלום ולא על הכל.'
  query_context: 'מאיפה מתבצע החיפוש, מה שמחליט מה היא עשויה לענות. הקשרים שנשלחו :'
  query_type: 'מגביל את התשובה לסוג אחד — שם ישות, או מפתח ספק.'
  query_length: 'כמה תוצאות. בהיעדרן, קונפיגורציית החבילה מחליטה.'
translations:
  title: תרגומים
  body: |
    השורה קוראת את התוויות שלה מהארבעה צדדים של הרכיב, כך שאין מקום למילוי בשפה. כותרות התוצאות, לעומת זאת, מגיעות מהרשומה עצמה או משם הנתיב — תרגום שלהם עוד לא מחובר, ועכשיו עמוד מציג את שם הנתיב בצורה אנושית.
