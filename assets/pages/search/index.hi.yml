page_title: खोजें
page_icon: 'ph:bold/magnifying-glass'
try:
  title: 'इसे आजमाएं'
  body: |
    एक फ़ील्ड, हर प्रकार का परिणाम। पृष्ठ नाम राउटर से आते हैं और किसी घोषणा की आवश्यकता नहीं होती; रिकॉर्ड उन एंटिटीज़ से आते हैं जो नीचे उल्लेखित विशेषता लेकर आती हैं। प्रत्येक परिणाम में यह होता है कि यह कहाँ जाता है, इसलिए बार को यह निर्णय लेने की आवश्यकता नहीं होती कि एक क्लिक का क्या अर्थ है।
providers:
  title: प्रदाता
  body: |
    एक प्रदाता खोजे जाने योग्य वस्तुओं का एक परिवार है। इंटरफ़ेस को लागू करना पूरी पंजीकरण प्रक्रिया है - ऑटो-कॉन्फ़िगरेशन इसे चिह्नित करता है, इसलिए एक एप्लिकेशन में लिखा गया प्रदाता अपने अस्तित्व से खोज में शामिल होता है। ये वही हैं जो यहाँ उत्तर देते हैं, उस नाम से जिससे एक क्वेरी खुद को सीमित करती है।
entities:
  title: 'खोजे जाने योग्य एंटिटीज़'
  body: |
    क्लास बताती है कि एक एंटिटी खोजने योग्य है; इसकी विशेषताएँ बताती हैं कि किस पर, प्रत्येक अपने प्रकार के साथ - एक शीर्षक पढ़ा जाता है, एक मात्रा एक आंकड़ा है, एक पता सम्पूर्ण या कुछ नहीं है - और प्रकार SQL और बिंदुओं को निर्धारित करता है। विरासत के सात में से छह स्कोरिंग फ़ंक्शन उस सूची में छिपे हुए थे। सातवाँ तर्क करता है, और वही एक स्कोरिंग क्लास का नाम देता है; एंटिटी जिसका उत्तर उन पर निर्भर करता है जो पूछ रहे हैं, प्रदाता: सत्य जोड़ता है और अपना प्रदाता प्राप्त करता है।
  empty: 'इस एप्लिकेशन में अभी तक कोई एंटिटी इस विशेषता की घोषणा नहीं करती - पृष्ठ परिणाम फिर भी कार्य करते हैं।'
  fields: फ़ील्ड
  scoring: 'स्कोर किया गया'
  contexts: संदर्भ
  own_provider: 'अपने स्वयं के प्रदाता द्वारा सेवा दी गई।'
api:
  title: API
  body: |
    एक परिणाम एक एंटिटी है, इसलिए इसका एंडपॉइंट उस एंटिटी का संग्रह है और कुछ नहीं। TypeScript रिपॉजिटरी जो उसी PHP क्लास से उत्पन्न होती है, इसे बताए बिना कॉल करती है कि यह कहाँ है - जो ऊपर वाले फ़ील्ड का उपयोग करता है।
  query: 'क्वेरी पैरामीटर'
  query_search: 'क्या खोजा जा रहा है। एक खाली क्वेरी कुछ नहीं जवाब देती बल्कि सब कुछ।'
  query_context: 'जहाँ से खोज की जा रही है, जो यह निर्णय करती है कि यह क्या उत्तर दे सकती है। भेजे गए संदर्भ:'
  query_type: 'उत्तर को एक प्रकार तक सीमित करता है - एक एंटिटी का नाम, या एक प्रदाता कुंजी।'
  query_length: 'कितने परिणाम। अनुपस्थित होने पर, बंडल कॉन्फ़िगरेशन निर्णय लेता है।'
translations:
  title: अनुवाद
  body: |
    बार अपने स्वयं के लेबल चारों तरफ से घटक से पढ़ती है, इसलिए एक प्लेसहोल्डर मार्कअप में कभी नहीं लिखा जाता। दूसरी ओर, परिणाम शीर्षक स्वयं रिकॉर्ड से या रूट नाम से आते हैं - उनका अनुवाद अभी तक नहीं किया गया है, और एक पृष्ठ वर्तमान में अपने रूट नाम को मानवित दिखाता है।
