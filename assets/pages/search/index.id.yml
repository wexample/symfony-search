page_title: Cari
page_icon: 'ph:bold/magnifying-glass'
try:
  title: Coba
  body: |
    Satu field, setiap jenis hasil. Nama halaman berasal dari router dan tidak memerlukan deklarasi; catatan berasal dari entitas yang membawa atribut di bawah ini. Setiap hasil menunjukkan kemana arahnya, jadi bar tidak perlu memutuskan apa arti sebuah klik.
providers:
  title: Penyedia
  body: |
    Penyedia adalah satu keluarga dari hal-hal yang dapat ditemukan. Mengimplementasikan antarmuka adalah seluruh pendaftaran — tag autokonfigurasi menandainya, sehingga penyedia yang ditulis dalam aplikasi bergabung dengan pencarian berdasarkan keberadaannya. Ini adalah yang menjawab di sini, berdasarkan nama yang dibatasi oleh kueri.
entities:
  title: 'Entitas yang dapat dicari'
  body: |
    Kelas menyatakan bahwa entitas dapat ditemukan; propertinya menyatakan tentang apa, masing-masing dengan jenisnya — sebuah judul dibaca, jumlah adalah angka, alamat adalah utuh atau tidak sama sekali — dan jenis menentukan baik SQL dan poin. Enam dari tujuh fungsi penilaian warisan adalah daftar itu dalam penyamaran. Yang ketujuh beralasan, dan yang satu itu menamai kelas penilaian; entitas yang jawabannya tergantung pada siapa yang bertanya menambahkan provider: true dan mendapatkan penyedia miliknya sendiri.
  empty: 'Belum ada entitas yang menyatakan atribut dalam aplikasi ini — hasil halaman masih berfungsi.'
  fields: Field
  scoring: 'Diberi skor oleh'
  contexts: Konteks
  own_provider: 'Dilayani oleh penyedia miliknya sendiri.'
api:
  title: API
  body: |
    Sebuah hasil adalah entitas, jadi endpointnya adalah koleksi dari entitas itu dan tidak ada yang lain. Repositori TypeScript yang dihasilkan dari kelas PHP yang sama memanggilnya tanpa diberi tahu di mana letaknya — yang digunakan oleh field di atas.
  query: 'Parameter kueri'
  query_search: 'Apa yang dicari. Kueri kosong tidak menjawab apa pun daripada segalanya.'
  query_context: 'Di mana pencarian dilakukan, yang menentukan apa yang mungkin dijawab. Konteks yang dikirim:'
  query_type: 'Membatasi jawaban ke satu jenis — nama entitas, atau kunci penyedia.'
  query_length: 'Berapa banyak hasil. Jika tidak ada, konfigurasi bundle memutuskan.'
translations:
  title: Terjemahan
  body: |
    Bar membaca labelnya sendiri dari empat sisi komponen, jadi placeholder tidak pernah ditulis dalam markup. Judul hasil, di sisi lain, berasal dari catatan itu sendiri atau dari nama rute — menerjemahkan itu belum terhubung, dan halaman saat ini menunjukkan nama rutenya yang dihumanisasi.
