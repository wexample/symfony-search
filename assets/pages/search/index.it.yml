page_title: Cerca
page_icon: 'ph:bold/magnifying-glass'
try:
  title: Provalo
  body: |
    Un campo, ogni tipo di risultato. I nomi delle pagine provengono dal router e non necessitano di dichiarazione; i record provengono dalle entità che portano l'attributo qui sotto. Ogni risultato indica dove va, quindi la barra non deve decidere cosa significa un clic.
providers:
  title: Fornitori
  body: |
    Un fornitore è una famiglia di cose rintracciabili. Implementare l'interfaccia è l'intera registrazione — l'autoconfigurazione lo etichetta, quindi un fornitore scritto in un'applicazione si unisce alla ricerca semplicemente esistendo. Questi sono quelli che rispondono qui, con il nome a cui una query si limita.
entities:
  title: 'Entità ricercabili'
  body: |
    La classe indica che un'entità è rintracciabile; le sue proprietà indicano su cosa, ognuna con il suo tipo — un titolo è leggibile, un importo è un numero, un indirizzo è tutto o niente — e il tipo decide sia il SQL che i punti. Sei delle sette funzioni di punteggio dell'eredità erano quella lista travestita. La settima ragionava, e quella nomina una classe di punteggio; l'entità la cui risposta dipende da chi sta chiedendo aggiunge provider: true e ottiene un fornitore tutto suo.
  empty: "Nessuna entità dichiara l'attributo in questa applicazione ancora — i risultati delle pagine funzionano comunque."
  fields: Campi
  scoring: 'Punteggiato da'
  contexts: Contesti
  own_provider: 'Servito da un fornitore tutto suo.'
api:
  title: "L'API"
  body: |
    Un risultato è un'entità, quindi il suo endpoint è la collezione di quell'entità e nient'altro. Il repository TypeScript generato dalla stessa classe PHP lo chiama senza essere detto dove si trova — ed è ciò che il campo qui sopra utilizza.
  query: 'Parametri della query'
  query_search: 'Cosa si sta cercando. Una query vuota non risponde a nulla piuttosto che a tutto.'
  query_context: 'Da dove viene effettuata la ricerca, il che decide a cosa può rispondere. Contesti inviati:'
  query_type: 'Limita la risposta a un tipo — un nome di entità o una chiave di fornitore.'
  query_length: 'Quanti risultati. In assenza, la configurazione del pacchetto decide.'
translations:
  title: Traduzioni
  body: |
    La barra legge le proprie etichette dalle quattro facce del componente, quindi un segnaposto non viene mai scritto nel markup. I titoli dei risultati, d'altra parte, provengono dal record stesso o dal nome della route — tradurre quelli non è ancora attivato, e una pagina attualmente mostra il suo nome di route umanizzato.
