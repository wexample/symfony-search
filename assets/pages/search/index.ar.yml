page_title: بحث
page_icon: 'ph:bold/magnifying-glass'
try:
  title: جربه
  body: |
    حقل واحد، كل نوع من النتائج. أسماء الصفحات تأتي من الموجه ولا تحتاج إلى إعلان؛ السجلات تأتي من الكيانات التي تحمل السمة أدناه. كل نتيجة تحمل وجهتها، لذا لا يتعين على الشريط اتخاذ قرار بشأن ما يعنيه النقر.
providers:
  title: المزودون
  body: |
    المزود هو عائلة واحدة من الأشياء القابلة للاكتشاف. تنفيذ الواجهة هو التسجيل الكامل - التكوين التلقائي يحدد ذلك، لذا فإن المزود المكتوب في تطبيق ينضم إلى البحث بوجوده. هؤلاء هم الذين يجيبون هنا، بالاسم الذي تقتصر عليه الاستعلام.
entities:
  title: 'الكيانات القابلة للبحث'
  body: |
    الفئة تقول إن الكيان قابل للاكتشاف؛ خصائصه تشير إلى ما، كل منها بنوعه - العنوان يُقرأ، المبلغ هو رقم، العنوان كامل أو لا شيء - والنوع يحدد كل من SQL والنقاط. ستة من سبع وظائف تسجيل الدرجات في التراث كانت تلك القائمة متخفية. السابع كان منطقيًا، وتلك تسمي فئة تسجيل الدرجات؛ الكيان الذي تعتمد إجابته على من يسأل يضيف provider: true ويحصل على مزود خاص به.
  empty: 'لا كيان يعلن عن السمة في هذا التطبيق حتى الآن - لا تزال نتائج الصفحات تعمل.'
  fields: الحقول
  scoring: 'تم تسجيله بواسطة'
  contexts: السياقات
  own_provider: 'يتم تقديمه بواسطة مزود خاص به.'
api:
  title: 'واجهة برمجة التطبيقات'
  body: |
    النتيجة هي كيان، لذا فإن نقطة النهاية الخاصة بها هي مجموعة ذلك الكيان ولا شيء آخر. مستودع TypeScript الناتج عن نفس فئة PHP يناديها دون أن يُقال له أين هي - وهو ما يستخدمه الحقل أعلاه.
  query: 'معلمات الاستعلام'
  query_search: 'ما الذي يتم البحث عنه. الاستعلام الفارغ لا يجيب على شيء بدلاً من كل شيء.'
  query_context: 'من أين يتم إجراء البحث، مما يحدد ما يمكن أن يجيب عليه. السياقات المشحونة :'
  query_type: 'يقتصر الجواب على نوع واحد - اسم كيان، أو مفتاح مزود.'
  query_length: 'عدد النتائج. في حالة الغياب، يحدد تكوين الحزمة.'
translations:
  title: الترجمات
  body: |
    يقرأ الشريط تسمياته الخاصة من الوجوه الأربعة للمكون، لذا فإن عنصر النائب لا يُكتب أبدًا في العلامات. من ناحية أخرى، تأتي عناوين النتائج من السجل نفسه أو من اسم المسار - ترجمة تلك لم يتم توصيلها بعد، وتظهر الصفحة حاليًا اسم مسارها بشكل إنساني.
