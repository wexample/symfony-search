page_title: Поиск
page_icon: 'ph:bold/magnifying-glass'
try:
  title: Попробовать
  body: |
    Одно поле, все виды результатов. Названия страниц берутся из маршрутизатора и не требуют объявления; записи приходят от сущностей, имеющих атрибут ниже. Каждый результат содержит информацию о том, куда он ведет, так что панель не должна решать, что означает клик.
providers:
  title: Поставщики
  body: |
    Поставщик — это одна семья находящихся вещей. Реализация интерфейса — это вся регистрация — автоконфигурация помечает это, так что поставщик, написанный в приложении, присоединяется к поиску, просто существуя. Это те, кто отвечает здесь, по имени, к которому ограничивается запрос.
entities:
  title: 'Ищущиеся сущности'
  body: |
    Класс говорит, что сущность доступна для поиска; её свойства указывают, по каким критериям, каждое со своим типом — заголовок читается, сумма — это число, адрес — или полное значение, или ничего — и тип определяет как SQL, так и баллы. Шесть из семи функций оценки наследия были этим списком в маскировке. Седьмая обосновывала, и она именует класс оценки; сущность, ответ которой зависит от того, кто спрашивает, добавляет provider: true и получает собственного поставщика.
  empty: 'В этом приложении пока ни одна сущность не объявляет атрибут — результаты страницы все еще работают.'
  fields: Поля
  scoring: 'Оценка по'
  contexts: Контексты
  own_provider: 'Обслуживается собственным поставщиком.'
api:
  title: API
  body: |
    Результат — это сущность, так что её конечная точка — это коллекция этой сущности и ничего больше. Репозиторий TypeScript, созданный из того же класса PHP, вызывает его, не будучи сказанным, где он находится — именно это поле выше и использует.
  query: 'Параметры запроса'
  query_search: 'Что ищется. Пустой запрос не дает ответа, а не все.'
  query_context: 'Откуда производится поиск, что определяет, что он может ответить. Доставленные контексты:'
  query_type: 'Ограничивает ответ одним видом — именем сущности или ключом поставщика.'
  query_length: 'Сколько результатов. При отсутствии этого, конфигурация пакета решает.'
translations:
  title: Переводы
  body: |
    Панель считывает свои собственные метки с четырех сторон компонента, так что заполнители никогда не пишутся в разметке. Заголовки результатов, с другой стороны, приходят из самой записи или из имени маршрута — перевод этих еще не настроен, и страница в настоящее время показывает своё имя маршрута в человекочитаемом виде.
