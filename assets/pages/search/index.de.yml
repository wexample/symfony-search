page_title: Suche
page_icon: 'ph:bold/magnifying-glass'
try:
  title: Ausprobieren
  body: |
    Ein Feld, jede Art von Ergebnis. Seitennamen stammen vom Router und benötigen keine Deklaration; Datensätze kommen von den Entitäten, die das untenstehende Attribut tragen. Jedes Ergebnis zeigt, wohin es führt, sodass die Leiste nichts über die Bedeutung eines Klicks entscheiden muss.
providers:
  title: Anbieter
  body: |
    Ein Anbieter ist eine Familie von auffindbaren Dingen. Die Implementierung der Schnittstelle ist die gesamte Registrierung – die Autokonfiguration kennzeichnet ihn, sodass ein in einer Anwendung geschriebener Anbieter durch seine Existenz der Suche beitritt. Dies sind die, die hier antworten, durch den Namen, auf den sich eine Abfrage einschränkt.
entities:
  title: 'Durchsuchbare Entitäten'
  body: |
    Die Klasse sagt, dass eine Entität auffindbar ist; ihre Eigenschaften sagen, wonach, jede mit ihrer Art – ein Titel wird gelesen, eine Menge ist eine Zahl, eine Adresse ist ganz oder nichts – und die Art entscheidet sowohl über das SQL als auch über die Punkte. Sechs der sieben Bewertungsfunktionen des Erbes waren diese Liste im Verborgenen. Der siebte argumentierte, und dieser nennt eine Bewertungsgruppe; die Entität, deren Antwort davon abhängt, wer fragt, fügt provider: true hinzu und erhält einen eigenen Anbieter.
  empty: 'Keine Entität deklariert das Attribut in dieser Anwendung bisher – Seitenresultate funktionieren weiterhin.'
  fields: Felder
  scoring: 'Bewertet nach'
  contexts: Kontexte
  own_provider: 'Von einem eigenen Anbieter bereitgestellt.'
api:
  title: 'Die API'
  body: |
    Ein Ergebnis ist eine Entität, daher ist sein Endpunkt die Sammlung dieser Entität und nichts anderes. Das TypeScript-Repository, das aus derselben PHP-Klasse generiert wurde, ruft es auf, ohne gesagt zu bekommen, wo es sich befindet – genau das verwendet das obige Feld.
  query: Abfrageparameter
  query_search: 'Wonach gesucht wird. Eine leere Abfrage ergibt nichts statt alles.'
  query_context: 'Von wo die Suche ausgeführt wird, was entscheidet, was sie beantworten kann. Gelieferte Kontexte :'
  query_type: 'Beschränkt die Antwort auf eine Art – einen Entitätsnamen oder einen Anbieter-Schlüssel.'
  query_length: 'Wie viele Ergebnisse. Abwesend entscheidet die Bundle-Konfiguration.'
translations:
  title: Übersetzungen
  body: |
    Die Leiste liest ihre eigenen Bezeichnungen von den vier Seiten der Komponente, sodass ein Platzhalter niemals im Markup geschrieben wird. Die Ergebnistitel hingegen stammen entweder aus dem Datensatz selbst oder vom Routenamen – das Übersetzen dieser ist noch nicht implementiert, und eine Seite zeigt derzeit ihren Routenamen in menschenlesbarer Form an.
